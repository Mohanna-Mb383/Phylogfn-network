# PhyloGFN-Net: small CPU configuration (smoke test / small simulated data)
AMP: false
PARSIMONY_PROBLEM: false
ENV:
  ENVIRONMENT_TYPE: ONE_STEP_LEVEL1_NETWORK
  SEQUENCE_TYPE: DNA_WITH_GAP
  NETWORK:
    R_MAX: 2
    LAMBDA_R: 1.0
  EVOLUTION_MODEL:
    COMPUTE_PRIOR: true
    PRIOR_LAMBDA: 10.0
  REWARD:
    C: 0.0
    RESHAPE_METHOD: EXPONENTIAL
    SCALE: 1.0
GFN:
  LOSS_TYPE: TB
  BACKWARD_MODELING: UNIFORM
  NORMALIZE_LIKELIHOOD: true
  CONDITION_ON_SCALE: false
  MODEL:
    ARCH: TRANSFORMER
    EDGES_MODELING:
      DISTRIBUTION: MIXTURE
      MIXTURE:
        EXPR_INDEPENDENT: true
        NB_COMPONENTS: 5
        TYPE: NORMAL
        USE_SOFT_PLUS: false
        HEAD: {ACT_FN: RELU, DROPOUT: 0.0, HIDDEN_SIZE: 256, INPUT_SIZE: 384, LAYERS: 3}
    RETICULATION_MODELING:
      NB_COMPONENTS: 5
      THETA_LOGIT_RANGE: 6.0
      HEAD: {ACT_FN: RELU, DROPOUT: 0.0, HIDDEN_SIZE: 256, INPUT_SIZE: 256, LAYERS: 3}
    TRANSFORMER:
      DEPTH: 6
      NUM_HEADS: 4
      MLP_RATIO: 2
      DROP_RATE: 0.0
      ATTN_DROP_RATE: 0.0
      SEQ_EMB: {ACT_FN: RELU, DROPOUT: 0.0, HIDDEN_SIZE: 256, INPUT_SIZE: -1, LAYERS: 0, OUTPUT_SIZE: 128}
      PART1_HEAD: {CONCATENATE_SUMMARY_TOKEN: true, INPUT_SIZE: 256, HIDDEN_SIZE: 256, OUTPUT_SIZE: 1, LAYERS: 3, DROPOUT: 0.0, ACT_FN: RELU}
      LOGITS_HEAD: {CONCATENATE_SUMMARY_TOKEN: true, INPUT_SIZE: 256, HIDDEN_SIZE: 256, OUTPUT_SIZE: 1, LAYERS: 3, DROPOUT: 0.0, ACT_FN: RELU}
      SINGLE_LOGITS_HEAD: {INPUT_SIZE: 256, HIDDEN_SIZE: 256, OUTPUT_SIZE: 1, LAYERS: 3, DROPOUT: 0.0, ACT_FN: RELU}
    Z_PARTITION_INIT: -1
    UPDATE_Z: true
    LR_MODEL: 0.0001
    LR_Z: 0.01
    GRAD_CLIP: 10
    L2_REG: 0
    LOSS_FN: MSE
    USE_LR_SCHEDULER: true
    EVALUATION:
      STATES_NUM: 30
      TRAJECTORIES_PER_STATES: 50
      EVALUATION_FREQ: 1
      BATCH_SIZE: 32
      FIXED_STATES: true
  TRAINING_DATA_LOADER:
    GFN_BATCH_SIZE: 64
    BEST_STATE_BATCH_SIZE: 64
    BEST_TREES_BUFFER_SIZE: 10000
    BEST_TREES_TOPOLOGY_ONLY: false
    MINI_BATCH_SPLITS: 1
    EPOCHS_NUM: 300
    STEPS_PER_EPOCH: 200
    EXPLORATION:
      METHOD: EPS_ANNEALING
      START_VALUE: 0.5
      END_VALUE: 0.001
      ANNEAL_TYPE: LINEAR
      T: 150
    TEMPERATURE_ANNEALING:
      TEMPERATURE_ANNEALING: true
      START_VALUE: 16.0
      END_VALUE: 1.0
      T: 200
      ANNEAL_TYPE: LINEAR
      INVERSE_TEMPERATURE_ANNEALING: true
